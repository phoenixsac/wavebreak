[Unit]
After=wavebreak-identity.service node_exporter.service
# lab devices have no route to the backend: identity.sh removes this flag when TELEMETRY=0
ConditionPathExists=/run/wavebreak/telemetry

[Service]
EnvironmentFile=/etc/wavebreak/labels.env
EnvironmentFile=-/etc/wavebreak/device.env
ExecStart=
ExecStart=/opt/fluent-bit/bin/fluent-bit -c /etc/fluent-bit/wavebreak.conf
Restart=always
RestartSec=5
