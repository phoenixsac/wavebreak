# Wavebreak device telemetry (T6.4). Env from /etc/wavebreak/labels.env + device.env:
# DEVICE_ID, HW_REV, REGION, FW_VERSION, PROM_HOST, PROM_PORT, LOKI_HOST, LOKI_PORT.
[SERVICE]
    flush         5
    log_level     warn
    parsers_file  /etc/fluent-bit/parsers.conf
    http_server   off

# --- metrics: local node_exporter (incl. textfile wavebreak_* metrics) -> remote_write
[INPUT]
    name             prometheus_scrape
    tag              metrics.node
    host             127.0.0.1
    port             9100
    metrics_path     /metrics
    scrape_interval  5s

# --- logs: journald (app, ota-agent, systemd PID 1 incl. OOM / restart messages)
[INPUT]
    name               systemd
    tag                journal
    systemd_filter     _SYSTEMD_UNIT=inference-app.service
    systemd_filter     _SYSTEMD_UNIT=ota-agent.service
    systemd_filter     _PID=1
    systemd_filter_type or
    read_from_tail     on
    strip_underscores  on
    lowercase          on
    db                 /var/lib/fluent-bit/journal.db

# --- logs: boot records
[INPUT]
    name              tail
    tag               boot
    path              /var/log/wavebreak/boot.log
    parser            json
    read_from_head    true
    db                /var/lib/fluent-bit/boot.db

# kmsg on Firecracker, nothing in containers (symlink set by wavebreak-identity)
@INCLUDE /etc/fluent-bit/wavebreak-runtime.conf

[FILTER]
    name    record_modifier
    match   journal
    record  source journal

[FILTER]
    name    record_modifier
    match   boot
    record  source boot

[OUTPUT]
    name         prometheus_remote_write
    match        metrics.*
    host         ${PROM_HOST}
    port         ${PROM_PORT}
    uri          /api/v1/write
    add_label    device_id ${DEVICE_ID}
    add_label    hw_rev ${HW_REV}
    add_label    region ${REGION}
    add_label    fw_version ${FW_VERSION}
    retry_limit  3

[OUTPUT]
    name         loki
    match_regex  ^(journal|boot|kmsg)$
    host         ${LOKI_HOST}
    port         ${LOKI_PORT}
    labels       job=wavebreak, device_id=${DEVICE_ID}, hw_rev=${HW_REV}, region=${REGION}, fw_version=${FW_VERSION}, $source
    line_format  json
    retry_limit  3
